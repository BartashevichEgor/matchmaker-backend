services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: matchmaker
      POSTGRES_USER: matchmaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U matchmaker -d matchmaker']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
    restart: unless-stopped
  api:
    build: ./core-api
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://matchmaker:${POSTGRES_PASSWORD}@db:5432/matchmaker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      REDIS_URL: redis://redis:6379/0
      MAIL_MODE: smtp
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: noreply@matchmaker.local
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  chat-db:
    image: postgres:16
    environment:
      POSTGRES_DB: matchmaker_chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:?Set CHAT_POSTGRES_PASSWORD in root .env}
    volumes:
      - chat_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chat -d matchmaker_chat']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  chat:
    build: ./chat-service
    environment:
      CHAT_PORT: 3000
      CHAT_DATABASE_URL: postgresql://chat:${CHAT_POSTGRES_PASSWORD}@chat-db:5432/matchmaker_chat
      MATCHMAKER_API_URL: http://api:8000
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://localhost:5173}
      CHAT_INTERNAL_TIMEOUT_MS: 3000
    ports:
      - '127.0.0.1:${CHAT_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
      chat-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  chat_data:
