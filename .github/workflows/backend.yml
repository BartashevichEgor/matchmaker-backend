name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matchmaker
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: matchmaker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matchmaker -d matchmaker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: core-api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          MATCHMAKER_TEST_DATABASE_URL: postgresql+psycopg://matchmaker:ci-test-password@127.0.0.1:5432/matchmaker_test
